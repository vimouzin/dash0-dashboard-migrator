# Bearer auth for the Dash0 datasource, read from a FILE at request time (no token in this file).
# The file is the compose secret `dash0_auth_token`, filled from $DASH0_AUTH_TOKEN by
# docker-compose.yaml. Docs: https://github.com/perses/perses/blob/v0.55.1/docs/api/secret.md
# (Authorization specification: type, credentialsFile).
kind: Secret
metadata:
  name: dash0
  project: oracle-review
spec:
  authorization:
    type: Bearer
    credentialsFile: /run/secrets/dash0_auth_token
