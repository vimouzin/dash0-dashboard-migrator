version: 1
inputs: [../assets/extensions-dashboard.json, ../assets/extensions-monitor.json, ../assets/extensions-max-monitor.json]
mappings: [../../../mappings/datadog]
warmup_seconds: 300
window_seconds: 600
settle_seconds: 120
step_seconds: 60
rate_interval: 5m
cases:
  - id: weighted-redis-memory
    source: extensions-dashboard.json
    request: /widgets/0/definition/requests/0
    panel: widget-0
    variables: {host: $run}
    relative_tolerance_pct: 4.9
    expected_outcome: best_effort
    expected_remarks: [WEIGHTED]
  - id: rollup-avg-redis-memory
    source: extensions-dashboard.json
    request: /widgets/1/definition/requests/0
    panel: widget-1
    variables: {host: $run}
    relative_tolerance_pct: 4.9
    expected_outcome: best_effort
    expected_remarks: [ROLLUP]
  - id: rollup-max-redis-memory
    source: extensions-dashboard.json
    request: /widgets/2/definition/requests/0
    panel: widget-2
    variables: {host: $run}
    relative_tolerance_pct: 4.9
    expected_outcome: best_effort
    expected_remarks: [ROLLUP]
  - id: as-rate-postgres-rows
    source: extensions-dashboard.json
    request: /widgets/3/definition/requests/0
    panel: widget-3
    variables: {host: $run}
    relative_tolerance_pct: 4.9
    expected_outcome: best_effort
    expected_remarks: [ASRATE]
  - id: exact-redis-memory
    source: extensions-dashboard.json
    request: /widgets/4/definition/requests/0
    panel: widget-4
    variables: {host: $run}
    relative_tolerance_pct: 3
    expected_outcome: translated
    expected_remarks: []
  - id: exact-redis-ratio
    source: extensions-dashboard.json
    request: /widgets/5/definition/requests/0
    panel: widget-5
    variables: {host: $run}
    relative_tolerance_pct: 3
    expected_outcome: translated
    expected_remarks: []
  - id: arithmetic-ratio-monitor
    source: extensions-monitor.json
    kind: monitor
    relative_tolerance_pct: 3
    expected_outcome: translated
    expected_remarks: []
  - id: arithmetic-max-percent-monitor
    source: extensions-max-monitor.json
    kind: monitor
    relative_tolerance_pct: 3
    expected_outcome: translated
    expected_remarks: []
