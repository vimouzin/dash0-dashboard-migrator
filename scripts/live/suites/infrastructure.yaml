  expected_outcome: translated
  expected_remarks: []
- id: docker-cpu-user
  source: infrastructure-docker.json
  request: /widgets/3/definition/requests/0
  panel: widget-3
  variables:
    host: $run
  expected_outcome: translated
  expected_remarks: []
- id: postgres-monitor-approx
  source: infrastructure-monitor.json
  kind: monitor
  expected_outcome: approximated
  expected_remarks:
  - FULLWINDOW
  - NEWHOST
