  expected_outcome: translated
  expected_remarks: []
- id: host-disk-utilization
  source: infrastructure-host.json
  request: /widgets/4/definition/requests/0
  panel: widget-4
  variables:
    host: $run
  expected_outcome: assumed
  expected_remarks:
