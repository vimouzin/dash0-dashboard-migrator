    host: $run
  expected_outcome: translated
  expected_remarks: []
- id: kafka-offline-partitions
  source: infrastructure-kafka.json
  request: /widgets/3/definition/requests/0
  panel: widget-3
  variables:
    host: $run
  expected_outcome: translated
  expected_remarks: []
  require_nonzero: false
- id: host-load
  source: infrastructure-host.json
  request: /widgets/0/definition/requests/0
  panel: widget-0
  variables:
    host: $run
  expected_outcome: translated
  expected_remarks: []
- id: host-cpu-user
