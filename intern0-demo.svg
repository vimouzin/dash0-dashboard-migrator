<svg xmlns="http://www.w3.org/2000/svg" width="900" height="677" viewBox="0 0 900 677">
<style>
.t{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;white-space:pre}
.l{opacity:0;animation:in .25s ease-out forwards}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
