<g class="l" style="animation-delay:0.78s"><text x="22" y="102" class="t"><tspan style="fill:#F34140">  ● </tspan><tspan style="fill:#E7E7EA;font-weight:700">intern0</tspan><tspan style="fill:#E7E7EA">   Datadog </tspan><tspan style="fill:#F34140">→</tspan><tspan style="fill:#E7E7EA"> Dash0   </tspan><tspan style="fill:#8B8C94">v0.1.0</tspan></text></g>
