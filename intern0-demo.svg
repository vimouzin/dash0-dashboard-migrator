<g class="l" style="animation-delay:5.60s"><text x="22" y="396" class="t"><tspan style="fill:#F34140">▸ </tspan><tspan style="fill:#E7E7EA;font-weight:700">Plan</tspan></text></g>
<g class="l" style="animation-delay:6.20s"><text x="22" y="417" class="t"><tspan style="fill:#E7E7EA">  ⚠️  dashboard Glitchy Shop – Minimal</tspan></text></g>
<g class="l" style="animation-delay:6.38s"><text x="22" y="438" class="t"><tspan style="fill:#8B8C94">       2 widgets: 1 ✅  1 ⚠️  0 ❌</tspan></text></g>
<g class="l" style="animation-delay:6.78s"><text x="22" y="459" class="t"><tspan style="fill:#E7E7EA">  ⚠️  monitor   [glitchy-shop] More than 5 checkout requests in 2 minutes</tspan></text></g>
<g class="l" style="animation-delay:6.96s"><text x="22" y="480" class="t"><tspan style="fill:#8B8C94">       message part '{{#is_recovery}}' dropped (Dash0 has one description)</tspan></text></g>
<g class="l" style="animation-delay:7.64s"><text x="22" y="522" class="t"><tspan style="fill:#E7E7EA">  Import into Dash0 now? [y/N] </tspan><tspan style="fill:#E7E7EA;font-weight:700">y</tspan></text></g>
<g class="l" style="animation-delay:8.44s"><text x="22" y="543" class="t"><tspan style="fill:#F34140">▸ </tspan><tspan style="fill:#E7E7EA;font-weight:700">Dash0</tspan><tspan style="fill:#8B8C94">  Europe · GCP Netherlands</tspan></text></g>
<g class="l" style="animation-delay:9.34s"><text x="22" y="564" class="t"><tspan style="fill:#3DDC97">  ✓ Logged in to Dash0</tspan></text></g>
