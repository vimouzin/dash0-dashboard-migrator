# Snapshot of the metric names in the Dash0 `default` dataset (development-time only).
# Taken 2026-11-07 with the dash0 MCP tool getMetricCatalog, dataset `default`, time range
# 2026-11-07T14:00Z–15:30Z (the only window with receiver data). Prefixes: container (unfiltered first
# page), and postgresql|nginx|redis|kafka|zookeeper|system|process|jvm|messaging via the filter
# otel.metric.name matches ^(…)\..* (no zookeeper or messaging metrics exist). Other prefixes
# (dash0, demo, aspnetcore, dotnet, db, …) are not needed by the pinned dashboards.
# scripts/build_expected.py uses it to tell "in the dataset" from "OTel metric, not in the dataset".
# Value: the metric type(s) seen (a name can appear with two types).
