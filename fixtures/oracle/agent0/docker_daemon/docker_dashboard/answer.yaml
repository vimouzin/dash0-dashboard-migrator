  otel_metrics: [container.cpu.usage.usermode]
  in_dataset: yes
  labels: {container_name: container_name}
  live_check: "yes, 23 series (rate window 5m substituted for $__rate_interval, 14:05–15:21Z)"
  notes: "Unit mismatch: docker.cpu.user is the percent of one core, not normalized (gauge). It is computed as ns of user CPU per second divided by 1e7 (generic.ConvertNanosecondsToHz in datadog-agent pkg/collector/corechecks/containers/docker/adapter.go). The OTel query returns ns/s (container.cpu.usage.usermode is a monotonic sum in ns). Proposed scale: divide by 1e7 to get percent (1e9 ns/s = 100%). Not applied. Unit references: https://docs.datadoghq.com/integrations/docker_daemon/#metrics and https://github.com/open-telemetry/opentelemetry-collector-contrib/blob/main/receiver/dockerstatsreceiver/documentation.md. Restarts produce several container_id series per container_name. Heatmap caveat as in widgets[3]."

