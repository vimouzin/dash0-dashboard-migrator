- source_path: 'widgets[3].definition.requests[0]'
  outcome: translated
  promql:
    - 'avg by (container_name) ({otel_metric_name="container.memory.anon", otel_metric_type="sum"})'
  otel_metrics: [container.memory.anon]
  in_dataset: no
  otel_source: [collector-contrib/receiver/dockerstatsreceiver/metadata.yaml]
  labels: {container_name: container_name}
  live_check: not in dataset
  notes: "docker.mem.rss is the non-cache memory of the container (bytes, gauge). The Datadog agent fills it from memory.stat 'anon' on cgroup v2 (pkg/util/cgroups/cgroupv2_memory.go) and from 'rss' on cgroup v1. This dataset is cgroup v2: container.memory.file is present, while v1-only container.memory.total_cache, which is enabled by default, is absent. So container.memory.anon (non-monotonic sum, By, cgroup v2 only) is the equivalent. It is disabled by default (metrics.container.memory.anon.enabled: true). On cgroup v1 hosts use container.memory.rss instead. Units match (bytes). $scope dropped. Restarts produce several container_id series per container_name, which avg by (container_name) collapses. Datadog heatmap shows the distribution of these per-container series; a Perses heatmap panel would need the same per-series input."

- source_path: 'widgets[4].definition.requests[0]'
  outcome: translated
  promql:
    - 'sum({otel_metric_name="container.state.status", otel_metric_type="sum", container_state_status="running"})'
  otel_metrics: [container.state.status]
  in_dataset: no
  otel_source: [collector-contrib/receiver/dockerstatsreceiver/metadata.yaml]
  labels: {}
  live_check: not in dataset
  notes: "container.state.status is 'Number of containers in a given state' (non-monotonic sum, attribute container.state.status). It is emitted per scrape without container resource attributes, so the grain is one series per collector and state, and sum() adds up hosts the way Datadog's sum does. It is disabled by default (metrics.container.state.status.enabled: true). It only counts containers the receiver scrapes, so excluded_images and the other receiver filters lower the count."

