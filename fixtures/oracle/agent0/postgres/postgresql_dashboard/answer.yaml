  live_check: "no; system.cpu.utilization cpu_mode values in the window are idle, interrupt, irq, nice, softirq, steal, system, user, wait (no guest)"
  notes: "The request is all-or-nothing. The other five formulas would map to system.cpu.utilization (gauge) with cpu_mode idle, system, wait (iowait), user, steal (stolen), for example avg({otel_metric_name=\"system.cpu.utilization\", otel_metric_type=\"gauge\", cpu_mode=\"idle\"}). Linux counts guest time inside user time, so it cannot be split out. They would also need Datadog percent vs OTel ratio scaling (x100) and have a grain difference: OTel is per logical CPU (cpu_logical_number), Datadog is per host."

- source_path: 'widgets[6].definition.requests[0]'
  outcome: translated
  promql: ['max({otel_metric_name="system.cpu.utilization", otel_metric_type="gauge", cpu_mode="wait"})']
  otel_metrics: [system.cpu.utilization]
  in_dataset: yes
  labels: {}
  live_check: "yes, 1 series (3-4 input series, hostmetrics cpuscraper only)"
  notes: "Datadog system.cpu.iowait is the percent of CPU time spent waiting on I/O; the OTel equivalent is cpu_mode=wait. Unit mismatch, not applied: Datadog is percent, OTel is a ratio, x100 to match (https://docs.datadoghq.com/integrations/system/#metrics). Grain differs: Datadog is one series per host (averaged across cores), OTel is one series per logical CPU, so max() here takes the busiest core rather than the busiest host. cpu_logical_number is the label that would collapse it to per-host. The dataset also carries system.cpu.utilization from opentelemetry.instrumentation.system_metrics, but it has no wait series."

- source_path: 'widgets[7].definition.requests[0]'
