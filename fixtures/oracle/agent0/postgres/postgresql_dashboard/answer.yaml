  promql:
    - 'sum({otel_metric_name="system.linux.memory.available", otel_metric_type="sum"})'
    - 'sum({otel_metric_name="system.memory.limit", otel_metric_type="sum"}) - sum({otel_metric_name="system.linux.memory.available", otel_metric_type="sum"})'
  otel_metrics: [system.linux.memory.available, system.memory.limit]
  in_dataset: partly
  otel_source: [collector-contrib/receiver/hostmetricsreceiver/internal/scraper/memoryscraper/metadata.yaml]
  labels: {}
  live_check: "partly; system.memory.limit returns 1 series (8317267968 By), system.linux.memory.available is not in dataset, so neither formula returns data"
  notes: "Datadog system.mem.usable is MemAvailable from /proc/meminfo; system.linux.memory.available is defined from the same MemAvailable estimate. It is optional and disabled by default in the memory scraper. system.mem.total maps to system.memory.limit (MemTotal). The dataset's system.memory.usage has no available state, and summing free+buffered+cached would be a computed approximation, so it is not used. The formula query2 - query1 is taken from the Datadog source. Unit mismatch, not applied: Datadog system.mem.* are in MiB, OTel in bytes, divide by 1048576 to match (https://docs.datadoghq.com/integrations/system/#metrics)."

