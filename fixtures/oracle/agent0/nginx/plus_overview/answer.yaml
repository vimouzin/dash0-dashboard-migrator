- source_path: 'widgets[1].definition.widgets[1].definition.requests[0]'
  outcome: translated
  promql:
    - 'sum({otel_metric_name="nginx.connections_accepted", otel_metric_type="sum", host_name=~"$host"})'
  otel_metrics: [nginx.connections_accepted]
  in_dataset: yes
  labels: {host: host_name}
  live_check: 'yes, 1 series (cumulative values 52-185 in 14:05Z-15:21Z)'
  notes: >-
    Datadog nginx.connections.accepted is a gauge that holds the cumulative total of accepted connections.
    The OTel metric is a cumulative monotonic sum of the same quantity ({connections}). It is read raw,
    without rate(), so the widget keeps showing a total and not connections/s, because the Datadog query
    has no per_second(). The total resets when nginx restarts. In the data window the series is replaced
    across restarts (dash0_resource_hash changes) with no overlap. The sum over host_name collapses it to
    one series per host.
- source_path: 'widgets[1].definition.widgets[2].definition.requests[0]'
  outcome: translated
  promql:
    - 'sum({otel_metric_name="nginx.connections_current", otel_metric_type="sum", state=~"reading|writing", host_name=~"$host"})'
  otel_metrics: [nginx.connections_current]
  in_dataset: yes
  labels: {host: host_name}
  live_check: 'yes, 1 series (value 1 throughout)'
  notes: >-
    NGINX Plus connections.active leaves out idle connections
    (https://nginx.org/en/docs/http/ngx_http_api_module.html#def_nginx_connections). The OTel state="active"
    value is stub_status "Active connections", and that includes Waiting
    (https://nginx.org/en/docs/http/ngx_http_stub_status_module.html). So state="active" would equal
    Plus active+idle, and reading+writing is the Plus equivalent. Live data confirms active = reading+writing+waiting
    (26 = 1 + 25). Non-monotonic sum, so no rate().
