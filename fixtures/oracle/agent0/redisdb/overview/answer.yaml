- source_path: 'widgets[1].definition.widgets[0].definition.requests[0]'
  outcome: translated
  promql:
    - '(avg(rate({otel_metric_name="redis.keyspace.hits", otel_metric_type="sum", host_name=~"$host"}[$__rate_interval])) / (avg(rate({otel_metric_name="redis.keyspace.hits", otel_metric_type="sum", host_name=~"$host"}[$__rate_interval])) + avg(rate({otel_metric_name="redis.keyspace.misses", otel_metric_type="sum", host_name=~"$host"}[$__rate_interval])))) * 100'
  otel_metrics: [redis.keyspace.hits, redis.keyspace.misses]
  in_dataset: yes
  labels: {host: host_name}
  live_check: 'yes, 1 series (about 23-37 between 14:15Z and 15:15Z)'
  notes: 'Datadog redis.stats.keyspace_hits/misses are per-second rates of the INFO counters. OTel has cumulative monotonic sums, so rate() matches them. The constant 100 comes from the source. $scope is dropped. OTel series split at each collector restart (new os_description / dash0_resource_hash); the outer avg() collapses that label, but while stale and new series overlap, avg covers both.'

