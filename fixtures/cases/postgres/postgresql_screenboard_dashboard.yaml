requests:
- source_path: widgets[1].definition.widgets[0].definition.requests[0]
  widget_type: query_value
  widget_title: Max connections in use
  queries:
  - name: query1
    data_source: metrics
    query: max:postgresql.percent_usage_connections{$scope,$host}
  formulas:
  - query1 * 100
- source_path: widgets[1].definition.widgets[1].definition.requests[0]
  widget_type: query_value
  widget_title: Rows fetched / returned
  queries:
  - name: query1
    data_source: metrics
    query: sum:postgresql.rows_fetched{$scope,$host}
  - name: query2
    data_source: metrics
    query: sum:postgresql.rows_returned{$scope,$host}
  formulas:
  - query1 / (query1 + query2) * 100
- source_path: widgets[2].definition.widgets[0].definition.requests[0]
  widget_type: timeseries
  widget_title: Dead rows
