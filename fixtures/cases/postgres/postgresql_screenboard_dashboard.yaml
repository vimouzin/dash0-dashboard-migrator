  - name: query3
    data_source: metrics
    query: avg:postgresql.live_rows{$scope,$db,$table,$host} by {table}
  - name: query4
    data_source: metrics
    query: avg:postgresql.dead_rows{$scope,$db,$table,$host} by {table}
  formulas:
  - query1
  - query2
  - query3
  - query4
