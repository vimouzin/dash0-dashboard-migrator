source:
  repository: DataDog/integrations-core
  commit: a9b9e42b7e484861ecbd1f5919da7c52a694b74d
  file: nginx/assets/dashboards/NGINX-Metrics_dashboard.json
  fixture: fixtures/datadog/integrations-core/nginx/dashboards/NGINX-Metrics_dashboard.json
service: nginx
dashboard_id: NGINX-Metrics_dashboard
title: NGINX - Metrics
layout_type: ordered
template_variables:
- name: scope
  prefix: null
  default: '*'
widgets:
- source_path: widgets[0]
  type: timeseries
  title: Dropped connections per second
  request_count: 1
  has_layout: false
- source_path: widgets[1]
  type: timeseries
  title: 5xx per second (only available for NGINX Plus)
  request_count: 1
  has_layout: false
- source_path: widgets[2]
  type: timeseries
  title: Requests per second
  request_count: 1
  has_layout: false
- source_path: widgets[3]
  type: timeseries
  title: Active connections per second
  request_count: 1
  has_layout: false
- source_path: widgets[4]
  type: timeseries
  title: 'Connections: reading,writing,waiting'
  request_count: 3
  has_layout: false
requests:
- source_path: widgets[0].definition.requests[0]
  widget_type: timeseries
  widget_title: Dropped connections per second
  queries:
  - name: null
    data_source: metrics
    query: sum:nginx.net.conn_dropped_per_s{$scope}
  formulas: []
- source_path: widgets[1].definition.requests[0]
  widget_type: timeseries
  widget_title: 5xx per second (only available for NGINX Plus)
  queries:
  - name: null
    data_source: metrics
    query: sum:nginx.server_zone.responses.5xx{$scope}
  formulas: []
- source_path: widgets[2].definition.requests[0]
  widget_type: timeseries
  widget_title: Requests per second
  queries:
  - name: null
    data_source: metrics
    query: sum:nginx.net.request_per_s{$scope}
  formulas: []
- source_path: widgets[3].definition.requests[0]
  widget_type: timeseries
  widget_title: Active connections per second
  queries:
  - name: null
    data_source: metrics
    query: sum:nginx.net.connections{$scope}
  formulas: []
- source_path: widgets[4].definition.requests[0]
  widget_type: timeseries
  widget_title: 'Connections: reading,writing,waiting'
  queries:
  - name: null
    data_source: metrics
    query: sum:nginx.net.reading{$scope}
  formulas: []
- source_path: widgets[4].definition.requests[1]
  widget_type: timeseries
  widget_title: 'Connections: reading,writing,waiting'
  queries:
  - name: null
    data_source: metrics
    query: sum:nginx.net.writing{$scope}
  formulas: []
- source_path: widgets[4].definition.requests[2]
  widget_type: timeseries
  widget_title: 'Connections: reading,writing,waiting'
  queries:
  - name: null
    data_source: metrics
    query: sum:nginx.net.waiting{$scope}
  formulas: []
