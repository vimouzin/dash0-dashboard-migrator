requests:
- source_path: widgets[2].definition.widgets[1].definition.requests[0]
  widget_type: topology_map
  widget_title: Kafka Topology for $topic, $env
  queries: []
  formulas: []
- source_path: widgets[2].definition.widgets[2].definition.requests[0]
  widget_type: query_table
  widget_title: Topic Health
  queries:
  - name: query1
    data_source: metrics
    query: count:data_streams.latency{type:kafka AND direction:out AND (pathway_type:edge OR pathway_type:partial_edge) AND $topic AND $env} by {topic,env}.as_rate()
  - name: query2
    data_source: metrics
    query: count:data_streams.latency{type:kafka AND direction:in AND (pathway_type:edge OR pathway_type:partial_edge) AND $topic AND $env} by {topic,env}.as_rate()
  - name: query3
    data_source: metrics
    query: max:data_streams.kafka.lag_seconds{$topic,$env} by {topic,env}
  formulas:
  - query1
  - query2
  - query3
- source_path: widgets[3].definition.widgets[0].definition.requests[0]
  widget_type: query_value
  widget_title: Offline Partitions
  queries:
  - name: query1
    data_source: metrics
    query: sum:kafka.replication.offline_partitions_count{*}.weighted()
  formulas:
  - query1
- source_path: widgets[3].definition.widgets[1].definition.requests[0]
  widget_type: query_value
  widget_title: Under Replicated Partitions
  queries:
