    query: max:kafka.replication.isr_expands.rate{$env}
  - name: query2
    data_source: metrics
    query: max:kafka.replication.isr_shrinks.rate{$env}
  formulas:
  - query1 - query2
- source_path: widgets[3].definition.widgets[3].definition.requests[0]
  widget_type: query_value
  widget_title: Follower Fetch Latency
  queries:
